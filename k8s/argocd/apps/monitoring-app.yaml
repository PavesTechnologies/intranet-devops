apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: paves-monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/PavesTechnologies/intranet-devops
    targetRevision: dev
    path: k8s/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
