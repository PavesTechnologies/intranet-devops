# Copy to intranet-devops at:  k8s/backend/airs/external-secret.yaml
#
# Materialises the whole `dev-airs` AWS Secrets Manager secret into a k8s
# Secret named airs-secrets, which all three Deployments consume via envFrom.
#
# `dataFrom.extract` copies EVERY key in the AWS secret, rather than the
# per-key `data:` mapping used by k8s/infra/debezium/debezium-external-secret.yaml.
# That is the right tool here: AIRS needs ~30 variables, and envFrom wants them
# all - listing each one would be 90 lines that silently drift whenever a new
# setting is added to app/core/config.py.
#
# ALTERNATIVE: if you would rather keep using the on-host ~/k8s/update-secret.sh
# that Jenkins already SSHes to run (which is how ums-secrets is created today -
# there is no ExternalSecret for it in the repo), then DELETE this file and make
# sure that script knows about `airs`. Do not do both: two owners of the same
# Secret will fight, and ESO with creationPolicy Owner will revert the script.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airs-secrets
  namespace: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: ClusterSecretStore
  target:
    name: airs-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dev-airs
