apiVersion: apps/v1
kind: Deployment
metadata:
  name: rms-deployment
  namespace: backend
  labels:
    app: rms
    team: paves
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rms
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rms
    spec:
      serviceAccountName: paves-service-account
      containers:
        - name: rms
          image: 743737183908.dkr.ecr.ap-south-1.amazonaws.com/paves/rms-prod:prod-67ad1a9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: rms-secrets
          env:
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/rms"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3
