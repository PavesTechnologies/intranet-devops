apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rms-hpa
  namespace: backend
  labels:
    app: rms
    team: paves
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rms-deployment
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
