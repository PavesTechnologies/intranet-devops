apiVersion: apps/v1
kind: Deployment
metadata:
  name: ums-deployment
  namespace: backend
  labels:
    app: ums
    team: paves
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ums
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ums
    spec:
      serviceAccountName: paves-service-account
      containers:
        - name: ums
          image: 743737183908.dkr.ecr.ap-south-1.amazonaws.com/paves/ums-dev:dev-5860590
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ums-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
