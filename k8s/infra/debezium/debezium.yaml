apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium
  namespace: infra
  labels:
    app: debezium
    team: paves
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debezium
  template:
    metadata:
      labels:
        app: debezium
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka..."
              until nc -z kafka-service.infra.svc.cluster.local 9092; do
                echo "Kafka not ready — waiting 5s..."
                sleep 5
              done
              echo "Kafka is ready."
      containers: 
        - name: debezium
          image: debezium/connect:3.0.0.Final
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: BOOTSTRAP_SERVERS
              value: "kafka-service.infra.svc.cluster.local:9092"
            - name: GROUP_ID
              value: "cdc-connect-group"
            - name: CONFIG_STORAGE_TOPIC
              value: "debezium.configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "debezium.offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "debezium.statuses"
            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: KEY_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: KEY_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"

          # RDS credentials from AWS Secrets Manager
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: debezium-rds-secret
                  key: db_host
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: debezium-rds-secret
                  key: db_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: debezium-rds-secret
                  key: db_password

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /connectors
              port: 8083
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: debezium-service
  namespace: infra
  labels:
    app: debezium
    team: paves
spec:
  selector:
    app: debezium
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
