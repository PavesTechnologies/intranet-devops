apiVersion: batch/v1
kind: Job
metadata:
  name: register-ums-eos-payable-connectors
  namespace: infra
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure

      containers:
        - name: register-connectors
          image: curlimages/curl:latest

          env:
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: debezium-rds-secret
                  key: db_host

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: debezium-rds-secret
                  key: db_user

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: debezium-rds-secret
                  key: db_password

          command:
            - sh
            - -c
            - |
              DEBEZIUM_URL="http://debezium-service.infra.svc.cluster.local:8083"

              echo "Waiting for Debezium to be ready..."

              until curl -s "$DEBEZIUM_URL/connectors" > /dev/null; do
                echo "Debezium not ready — waiting 10s..."
                sleep 10
              done

              echo "Debezium is ready."

              # ==========================================
              # 1. UMS MYSQL SOURCE
              # ==========================================

              SRC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                "$DEBEZIUM_URL/connectors/mysql-ums-source")

              if [ "$SRC_STATUS" = "200" ]; then
                echo "UMS source connector already registered. Skipping."
              else
                echo "Registering UMS source connector..."

                SRC_HTTP_CODE=$(curl -s -o /tmp/mysql-ums-source-create.json -w "%{http_code}" \
                  -X POST "$DEBEZIUM_URL/connectors" \
                  -H "Content-Type: application/json" \
                  -d "{
                    \"name\": \"mysql-ums-source\",
                    \"config\": {
                      \"connector.class\": \"io.debezium.connector.mysql.MySqlConnector\",
                      \"database.hostname\": \"$MYSQL_HOST\",
                      \"database.port\": \"3306\",
                      \"database.user\": \"$MYSQL_USER\",
                      \"database.password\": \"$MYSQL_PASSWORD\",
                      \"database.ssl.mode\": \"preferred\",

                      \"database.server.id\": \"184063\",
                      \"topic.prefix\": \"ums_cdc\",

                      \"database.include.list\": \"ums\",
                      \"table.include.list\": \"ums.user,ums.role,ums.user_role\",

                      \"schema.history.internal.kafka.bootstrap.servers\": \"kafka-service.infra.svc.cluster.local:9092\",
                      \"schema.history.internal.kafka.topic\": \"schema-history.ums-cdc\",

                      \"key.converter\": \"org.apache.kafka.connect.json.JsonConverter\",
                      \"key.converter.schemas.enable\": \"false\",

                      \"value.converter\": \"org.apache.kafka.connect.json.JsonConverter\",
                      \"value.converter.schemas.enable\": \"false\",

                      \"snapshot.mode\": \"initial\"
                    }
                  }")

                if [ "$SRC_HTTP_CODE" != "200" ] && [ "$SRC_HTTP_CODE" != "201" ]; then
                  echo "ERROR: UMS source connector registration failed (HTTP $SRC_HTTP_CODE)"
                  cat /tmp/mysql-ums-source-create.json
                  echo ""
                  exit 1
                fi

                echo "UMS source connector registered (HTTP $SRC_HTTP_CODE)."
              fi


              # ==========================================
              # 2. EOS MYSQL SOURCE
              # ==========================================

              EOS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                "$DEBEZIUM_URL/connectors/mysql-eos-source")

              if [ "$EOS_STATUS" = "200" ]; then
                echo "EOS source connector already registered. Skipping."
              else
                echo "Registering EOS source connector..."

                EOS_HTTP_CODE=$(curl -s -o /tmp/mysql-eos-source-create.json -w "%{http_code}" \
                  -X POST "$DEBEZIUM_URL/connectors" \
                  -H "Content-Type: application/json" \
                  -d "{
                    \"name\": \"mysql-eos-source\",
                    \"config\": {
                      \"connector.class\": \"io.debezium.connector.mysql.MySqlConnector\",
                      \"database.hostname\": \"$MYSQL_HOST\",
                      \"database.port\": \"3306\",
                      \"database.user\": \"$MYSQL_USER\",
                      \"database.password\": \"$MYSQL_PASSWORD\",
                      \"database.ssl.mode\": \"preferred\",

                      \"database.server.id\": \"184062\",
                      \"topic.prefix\": \"eos_cdc\",

                      \"database.include.list\": \"eos\",
                      \"table.include.list\": \"eos.employee_details,eos.departments\",

                      \"schema.history.internal.kafka.bootstrap.servers\": \"kafka-service.infra.svc.cluster.local:9092\",
                      \"schema.history.internal.kafka.topic\": \"schema-history.eos-cdc\",

                      \"key.converter\": \"org.apache.kafka.connect.json.JsonConverter\",
                      \"key.converter.schemas.enable\": \"false\",

                      \"value.converter\": \"org.apache.kafka.connect.json.JsonConverter\",
                      \"value.converter.schemas.enable\": \"false\",

                      \"snapshot.mode\": \"initial\"
                    }
                  }")

                if [ "$EOS_HTTP_CODE" != "200" ] && [ "$EOS_HTTP_CODE" != "201" ]; then
                  echo "ERROR: EOS source connector registration failed (HTTP $EOS_HTTP_CODE)"
                  cat /tmp/mysql-eos-source-create.json
                  echo ""
                  exit 1
                fi

                echo "EOS source connector registered (HTTP $EOS_HTTP_CODE)."
              fi


              # ==========================================
              # 3. VERIFY
              # ==========================================

              echo "Verifying connector statuses..."

              sleep 5

              echo "----- UMS -----"
              SRC_STATUS_CODE=$(curl -s -o /tmp/mysql-ums-source-status.json -w "%{http_code}" \
                "$DEBEZIUM_URL/connectors/mysql-ums-source/status")
              cat /tmp/mysql-ums-source-status.json
              echo ""

              if [ "$SRC_STATUS_CODE" != "200" ]; then
                echo "ERROR: could not fetch status for mysql-ums-source (HTTP $SRC_STATUS_CODE)"
                exit 1
              fi

              if grep -q '"state":"FAILED"' /tmp/mysql-ums-source-status.json; then
                echo "ERROR: mysql-ums-source connector/task is in FAILED state."
                exit 1
              fi

              echo "----- EOS -----"
              EOS_STATUS_CODE=$(curl -s -o /tmp/mysql-eos-source-status.json -w "%{http_code}" \
                "$DEBEZIUM_URL/connectors/mysql-eos-source/status")
              cat /tmp/mysql-eos-source-status.json
              echo ""

              if [ "$EOS_STATUS_CODE" != "200" ]; then
                echo "ERROR: could not fetch status for mysql-eos-source (HTTP $EOS_STATUS_CODE)"
                exit 1
              fi

              if grep -q '"state":"FAILED"' /tmp/mysql-eos-source-status.json; then
                echo "ERROR: mysql-eos-source connector/task is in FAILED state."
                exit 1
              fi

              echo "Done."