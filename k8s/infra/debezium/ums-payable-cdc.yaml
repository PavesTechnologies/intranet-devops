apiVersion: batch/v1
kind: Job
metadata:
  name: register-ums-payable-connectors
  namespace: infra
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register-connectors
          image: curlimages/curl:latest
          env:
            # MySQL Source Credentials
            - name: MYSQL_HOST
              valueFrom:
                secretKeyRef:
                  name: debezium-rds-secret
                  key: db_host
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: debezium-rds-secret
                  key: db_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: debezium-rds-secret
                  key: db_password

            # Aiven PostgreSQL Sink Credentials
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: aiven-postgres-secret
                  key: pg_host
            - name: PG_PORT
              valueFrom:
                secretKeyRef:
                  name: aiven-postgres-secret
                  key: pg_port
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: aiven-postgres-secret
                  key: pg_user
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aiven-postgres-secret
                  key: pg_password
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  name: aiven-postgres-secret
                  key: pg_database
          command:
            - sh
            - -c
            - |
              DEBEZIUM_URL="http://10.43.174.242:8083"
              echo "Waiting for Debezium to be ready..."
              until curl -s "$DEBEZIUM_URL/connectors" > /dev/null; do
                echo "Debezium not ready — waiting 10s..."
                sleep 10
              done

              # ==========================================
              # 1. REGISTER MYSQL SOURCE CONNECTOR
              # ==========================================
              SRC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEBEZIUM_URL/connectors/mysql-ums-source")
              if [ "$SRC_STATUS" = "200" ]; then
                echo "Source connector already registered. Skipping."
              else
                echo "Registering MySQL Source connector..."
                curl -X POST "$DEBEZIUM_URL/connectors" \
                  -H "Content-Type: application/json" \
                  -d "{
                    \"name\": \"mysql-ums-source\",
                    \"config\": {
                      \"connector.class\": \"io.debezium.connector.mysql.MySqlConnector\",
                      \"database.hostname\": \"$MYSQL_HOST\",
                      \"database.port\": \"3306\",
                      \"database.user\": \"$MYSQL_USER\",
                      \"database.password\": \"$MYSQL_PASSWORD\",
                      \"database.ssl.mode\": \"preferred\",
                      \"database.server.id\": \"184061\",
                      \"topic.prefix\": \"ums_cdc\",

                      \"database.include.list\": \"ums\",
                      \"table.include.list\": \"ums.user,ums.role,ums.user_role\",

                      \"schema.history.internal.kafka.bootstrap.servers\": \"kafka-service.infra.svc.cluster.local:9092\",
                      \"schema.history.internal.kafka.topic\": \"schema-history.ums-cdc\",
                      \"key.converter\": \"org.apache.kafka.connect.json.JsonConverter\",
                      \"key.converter.schemas.enable\": \"false\",
                      \"value.converter\": \"org.apache.kafka.connect.json.JsonConverter\",
                      \"value.converter.schemas.enable\": \"false\",
                      \"snapshot.mode\": \"initial\"
                    }
                  }"
              fi

              # ==========================================
              # 2. REGISTER POSTGRESQL SINK CONNECTOR
              # ==========================================
              SINK_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEBEZIUM_URL/connectors/postgres-stg-sink")
              if [ "$SINK_STATUS" = "200" ]; then
                echo "Sink connector already registered. Skipping."
              else
                echo "Registering Postgres Sink connector..."
                JDBC_URL="jdbc:postgresql://$PG_HOST:$PG_PORT/$PG_DATABASE?sslmode=require"

                curl -X POST "$DEBEZIUM_URL/connectors" \
                  -H "Content-Type: application/json" \
                  -d "{
                    \"name\": \"postgres-stg-sink\",
                    \"config\": {
                      \"connector.class\": \"io.debezium.connector.jdbc.JdbcSinkConnector\",
                      \"tasks.max\": \"1\",
                      \"topics\": \"ums_cdc.ums.user,ums_cdc.ums.role,ums_cdc.ums.user_role\",
                      \"connection.url\": \"\${JDBC_URL}\",
                      \"connection.username\": \"\${PG_USER}\",
                      \"connection.password\": \"\${PG_PASSWORD}\",
                      \"insert.mode\": \"upsert\",
                      \"primary.key.mode\": \"record_key\",
                      \"primary.key.fields\": \"user_id,role_id\",
                      \"key.converter\": \"org.apache.kafka.connect.json.JsonConverter\",
                      \"key.converter.schemas.enable\": \"false\",
                      \"value.converter\": \"org.apache.kafka.connect.json.JsonConverter\",
                      \"value.converter.schemas.enable\": \"false\",
                      \"transforms\": \"unwrap,reroute\",
                      \"transforms.unwrap.type\": \"io.debezium.transforms.ExtractNewRecordState\",
                      \"transforms.unwrap.drop.tombstones\": \"false\",
                      \"transforms.reroute.type\": \"org.apache.kafka.connect.transforms.RegexRouter\",
                      \"transforms.reroute.regex\": \"ums_cdc\\\\.ums\\\\.(.*)\",
                      \"transforms.reroute.replacement\": \"stg.\$1\"
                    }
                  }"
              fi

              echo "Verifying connector statuses..."
              sleep 5
              curl -s "$DEBEZIUM_URL/connectors/mysql-ums-source/status"
              echo ""
              curl -s "$DEBEZIUM_URL/connectors/postgres-stg-sink/status"
              echo "Done."
